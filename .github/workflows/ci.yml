name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This repo is one package of the MemoryOverEth pnpm workspace and depends on
# `@limccn/longstone-surface`, `@limccn/longstone-wallet` and
# `@limccn/menhir-core` through `workspace:*`.
# CI assembles the same layout the developer checkout uses:
#
#   workspace/
#   ├── pnpm-workspace.yaml / package.json
#   ├── menhir/                 (sibling repo; @limccn/menhir-core in menhir/ts)
#   ├── longstone-surface/      (sibling repo; @limccn/longstone-surface)
#   ├── longstone-wallet/       (sibling repo; @limccn/longstone-wallet)
#   └── app/                    (this repo)
#
# The sibling repos are public; the workflow token can read them.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout longstone-ext
        uses: actions/checkout@v4
        with:
          path: workspace/app

      - name: Checkout menhir (@limccn/menhir-core)
        uses: actions/checkout@v4
        with:
          repository: limccn/menhir
          token: ${{ secrets.WORKSPACE_REPO_TOKEN || secrets.MENHIR_REPO_TOKEN || github.token }}
          path: workspace/menhir

      - name: Checkout longstone-surface (@limccn/longstone-surface)
        uses: actions/checkout@v4
        with:
          repository: limccn/longstone-surface
          token: ${{ github.token }}
          path: workspace/longstone-surface

      - name: Checkout longstone-wallet (@limccn/longstone-wallet)
        uses: actions/checkout@v4
        with:
          repository: limccn/longstone-wallet
          token: ${{ github.token }}
          path: workspace/longstone-wallet

      - name: Assemble workspace
        working-directory: workspace
        run: |
          # Only the packages this extension actually resolves are listed.
          # menhir/contracts is absent: the extension consumes the TypeScript
          # core, not the Solidity project.
          printf 'packages:\n  - "app"\n  - "longstone-surface"\n  - "longstone-wallet"\n  - "menhir/ts"\nallowBuilds:\n  "esbuild": true\n' > pnpm-workspace.yaml
          # No repo is checked out at the workspace root, so pnpm/action-setup
          # needs a manifest here to read `packageManager`.
          printf '{"name":"ci-workspace","private":true,"packageManager":"pnpm@12.11.2"}\n' > package.json

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: workspace/package.json

      # No lockfile exists at the assembled workspace root; caching is disabled
      # (longstone-wallet's lockfile is nested and is not a root cache key).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: workspace
        # L-6 exception: assembled workspace cannot use a frozen lockfile.
        # See https://github.com/limccn/longstone/blob/main/docs/supply-chain.md
        run: pnpm install --no-frozen-lockfile

      # The surface package is consumed through its `dist` build, so it must be
      # compiled (and have its own tests green) before the extension is tested.
      - name: Build @limccn/menhir-core
        working-directory: workspace
        run: pnpm --filter @limccn/menhir-core build

      - name: Test @limccn/menhir-core
        working-directory: workspace
        run: pnpm --filter @limccn/menhir-core test

      - name: Build @limccn/longstone-surface
        working-directory: workspace
        run: pnpm --filter @limccn/longstone-surface build

      - name: Test @limccn/longstone-surface
        working-directory: workspace
        run: pnpm --dir longstone-surface test

      # The wallet core is consumed through its `dist` build. Its tests run in
      # this job as well: the browser and VS Code surfaces share the core, so
      # a shared-core regression fails both CIs.
      - name: Build @limccn/longstone-wallet
        working-directory: workspace
        run: pnpm --filter @limccn/longstone-wallet build

      - name: Test @limccn/longstone-wallet
        working-directory: workspace
        run: pnpm --filter @limccn/longstone-wallet test

      - name: Typecheck extension
        working-directory: workspace
        run: pnpm --dir app typecheck

      # Build before test: the manifest tests assert the *generated* manifest
      # (including side_panel, which WXT adds from the sidepanel entrypoint),
      # not only the source config. The audit then re-checks both artifacts.
      - name: Build chrome
        working-directory: workspace
        run: pnpm --dir app build:chrome

      - name: Build edge
        working-directory: workspace
        run: pnpm --dir app build:edge

      - name: Test extension (asserts built manifests)
        working-directory: workspace
        run: pnpm --dir app test

      # The audit inspects `.output/{chrome,edge}-mv3`: manifest permissions,
      # remote-code patterns, signing entry points, and 32-byte hex literals.
      - name: Audit built bundle
        working-directory: workspace
        run: pnpm --dir app run audit

      - name: Upload built extensions
        uses: actions/upload-artifact@v4
        with:
          name: longstone-ext-mv3
          path: |
            workspace/app/.output/chrome-mv3
            workspace/app/.output/edge-mv3
          if-no-files-found: error

  # AC-13: load the built extension in Chromium and run the Playwright suite
  # against a real local Hardhat node (chain-id 84532). The workspace assembly
  # mirrors `verify`; menhir/contracts joins it because `scripts/e2e.mjs`
  # starts `hardhat node` from there (read-only: no menhir source changes).
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout longstone-ext
        uses: actions/checkout@v4
        with:
          path: workspace/app

      - name: Checkout menhir (@limccn/menhir-core + contracts)
        uses: actions/checkout@v4
        with:
          repository: limccn/menhir
          token: ${{ secrets.WORKSPACE_REPO_TOKEN || secrets.MENHIR_REPO_TOKEN || github.token }}
          path: workspace/menhir

      - name: Checkout longstone-surface (@limccn/longstone-surface)
        uses: actions/checkout@v4
        with:
          repository: limccn/longstone-surface
          token: ${{ github.token }}
          path: workspace/longstone-surface

      - name: Checkout longstone-wallet (@limccn/longstone-wallet)
        uses: actions/checkout@v4
        with:
          repository: limccn/longstone-wallet
          token: ${{ github.token }}
          path: workspace/longstone-wallet

      - name: Assemble workspace
        working-directory: workspace
        run: |
          # `menhir/contracts` is included here (not in `verify`): the e2e
          # orchestrator runs `hardhat node` from that package.
          printf 'packages:\n  - "app"\n  - "longstone-surface"\n  - "longstone-wallet"\n  - "menhir/ts"\n  - "menhir/contracts"\nallowBuilds:\n  "esbuild": true\n' > pnpm-workspace.yaml
          printf '{"name":"ci-workspace","private":true,"packageManager":"pnpm@12.11.2"}\n' > package.json

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: workspace/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: workspace
        # L-6 exception: assembled workspace cannot use a frozen lockfile.
        # See https://github.com/limccn/longstone/blob/main/docs/supply-chain.md
        run: pnpm install --no-frozen-lockfile

      - name: Build @limccn/menhir-core
        working-directory: workspace
        run: pnpm --filter @limccn/menhir-core build

      - name: Build @limccn/longstone-surface
        working-directory: workspace
        run: pnpm --filter @limccn/longstone-surface build

      - name: Build @limccn/longstone-wallet
        working-directory: workspace
        run: pnpm --filter @limccn/longstone-wallet build

      - name: Build @limccn/menhir-contracts
        working-directory: workspace
        run: pnpm --filter @limccn/menhir-contracts build

      - name: Build chrome
        working-directory: workspace
        run: pnpm --dir app build:chrome

      - name: Install Playwright Chromium
        working-directory: workspace
        run: pnpm --dir app exec playwright install --with-deps chromium

      - name: Run extension e2e
        working-directory: workspace/app
        run: node scripts/e2e.mjs --skip-build

      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-results
          path: workspace/app/test-results
          if-no-files-found: ignore
